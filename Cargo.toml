[package]
name = "agent-spy"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = "0.25.10"
notify = "8.2.0"
x11rb = { version = "0.14.0", features = ["image"] }

# Image decoding is painfully slow unoptimized, so optimize dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
